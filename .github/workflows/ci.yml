name: oaip
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }

      # Warrant is a normative dependency, not an optional extra: SPEC §3 makes
      # the decision layer a real Warrant record and SPEC §1 defines this
      # format's canonicalization as "exactly per Warrant SPEC §4".
      #
      # WHICH Warrant is therefore load-bearing, and a stale pin answers it
      # wrongly. The previous pin (707b2c9a, 2026-07-18) predated Warrant's strict
      # I-JSON layer almost entirely: measured against it, tests/ijson_parity.py
      # reports DRIFT on 7 of 25 reject vectors — NaN, Infinity, -Infinity, three
      # lone-surrogate cases and a leading BOM were all accepted there and are
      # refused here. Refresh deliberately, and expect the parity test to say so
      # when the pin drifts behind again.
      #
      # 2026-07-31 — THIS PIN IS NOW A BREAKING ONE, IN BOTH DIRECTIONS.
      # 8508a4a is Warrant SPEC v0.4 / package 0.6.0, which replaced the §5
      # signed message: `"warrant-sig-v1:" || WarrantID_raw` (47 bytes) instead
      # of the bare 32-byte WarrantID. OAIP verifies Ed25519 in process, so it
      # carries its own copy of that construction — and the two constructions are
      # DISJOINT by design, with no dual-accept window. Therefore:
      #
      #   * this checkout does NOT work against a pre-0.6.0 Warrant, and
      #   * a pre-0.6.0 checkout does NOT work against this pin.
      #
      # Move the pin and the implementation TOGETHER or the suite is measuring a
      # verifier that agrees with nothing. `tests/signature_gate.py` part A
      # asserts the installed CLI really signs the v0.4 message, so a half-bump
      # fails here rather than in a user's store.
      - name: Warrant (normative dependency, pinned — v0.4 / 0.6.0)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'cryptography>=42,<46'
          git clone -q https://github.com/s0fractal/warrant /tmp/warrant
          git -C /tmp/warrant checkout -q 8508a4adfd15f95c1acd7b8c64340c5e3d9374a2

      # ONE command. The previous workflow listed steps by hand, and that is how
      # `tools/intoto.py selftest` came to exist while running nowhere: a commit
      # claimed the wiring was fixed after wiring only one of two new tests. The
      # membership of the suite now lives in tools/check.py, which also reports a
      # check that COULD NOT RUN as UNRUN (exit 2) rather than as a pass.
      #
      # No `--allow-unrun` here: in CI every prerequisite is installed above, so
      # an unrun check means the environment is wrong and the run must fail. A
      # green build that quietly skipped something is the defect this repository
      # keeps finding.
      - name: Every claim in this repository, executed (tools/check.py)
        env:
          WARRANT_IMPL: /tmp/warrant/impl
          WARRANT_CLI: python3 /tmp/warrant/impl/warrant.py
        run: python3 tools/check.py
