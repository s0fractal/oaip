name: oaip
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Warrant is a normative dependency, not an optional extra: SPEC §3 makes
      # the decision layer a real Warrant record and SPEC §1 defines this
      # format's canonicalization as "exactly per Warrant SPEC §4". Pinned by
      # commit so a run is reproducible; refresh deliberately.
      - name: Warrant (normative dependency, pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'cryptography>=42,<46'
          git clone -q https://github.com/s0fractal/warrant /tmp/warrant
          git -C /tmp/warrant checkout -q 707b2c9a5c5a3f7957839bb76ee3cb7d3796ae4e

      # ONE command. The previous workflow listed steps by hand, and that is how
      # `tools/intoto.py selftest` came to exist while running nowhere: a commit
      # claimed the wiring was fixed after wiring only one of two new tests. The
      # membership of the suite now lives in tools/check.py, which also reports a
      # check that COULD NOT RUN as UNRUN (exit 2) rather than as a pass.
      #
      # No `--allow-unrun` here: in CI every prerequisite is installed above, so
      # an unrun check means the environment is wrong and the run must fail. A
      # green build that quietly skipped something is the defect this repository
      # keeps finding.
      - name: Every claim in this repository, executed (tools/check.py)
        env:
          WARRANT_IMPL: /tmp/warrant/impl
          WARRANT_CLI: python3 /tmp/warrant/impl/warrant.py
        run: python3 tools/check.py
