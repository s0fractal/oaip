name: publish

# Auto-publish `oaip` to PyPI via Trusted Publishing (OIDC) — no stored tokens.
# A GitHub Release named `vX.Y.Z` builds, validates, and publishes.
# `workflow_dispatch` publishes to TestPyPI for a dry run.
# One-time PyPI setup is documented in PUBLISHING.md.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Version matches release tag
        if: github.event_name == 'release'
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$VER tag=$TAG"
          test "$VER" = "$TAG" || { echo "::error::tag v$TAG does not match pyproject version $VER"; exit 1; }

      # Everything below runs from /tmp, never from the checkout. `oaip` is a
      # flat single module installed from impl/, and a CLI that only works next
      # to its own repo would look perfectly healthy from inside it.
      - name: Validate metadata + that the wheel runs from anywhere
        run: |
          twine check dist/*
          python -m venv /tmp/ov
          /tmp/ov/bin/pip install dist/*.whl
          ( cd /tmp && /tmp/ov/bin/oaip --help )
          ( cd /tmp && /tmp/ov/bin/oaip conformance "$GITHUB_WORKSPACE/examples/vectors.json" \
              | grep -q "OAIP-CONFORMANCE: ALL PASS" )

      # The gate is checked before it is trusted. `tools/check.py` exists in this
      # repo because a test that ran nowhere still reported success for weeks;
      # a release gate whose extractor is wrong fails the same way, silently and
      # green.
      - name: The release gate's own selftest
        run: python3 tools/check_release_surface.py --selftest

      # The artifact must be able to do everything the docs tell a stranger to
      # do. The sibling project published warrant-verify 0.4.0 while its README
      # documented `verify --store-mode --json`; the release predated the
      # feature, so `pip install` + the README gave `unrecognized arguments`.
      # This step is what makes that state unpublishable rather than merely
      # regrettable — and this repo has never published anything, so this is
      # the FIRST time the wheel is judged as the artifact a stranger gets.
      #
      # HONEST SCOPE — read before treating a green run as more than it is:
      # `init` / `do` / `accept` / `bind` / `rebuild` / `verify` all shell out
      # to a **Warrant CLI**, which is a normative dependency (SPEC §1, §3) but
      # NOT a Python dependency, and is not present in the fresh venv above. So
      # those verbs are checked for EXISTENCE and for accepting their documented
      # flags — not for accepting anything. The §4 rule that gives this project
      # its point (execution success is not acceptance) is exercised by
      # `tools/check.py` in ci.yml, from a checkout, against a real Warrant
      # checkout. Nothing here re-proves it.
      - name: Documented CLI surface exists in the built wheel
        run: python3 tools/check_release_surface.py --wheel "$(ls dist/*.whl)" --bin /tmp/ov/bin

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    # Real, irreversible publish — only from a published GitHub Release.
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    # Dry run: manual trigger publishes to TestPyPI.
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
