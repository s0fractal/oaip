[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oaip"
# Tracks SPEC.md ("Specification v0.1"). Tags: v0.1.0, v0.2.0.
# 0.2.1 is a defect release: 0.2.0 is on PyPI with `oaip conformance` and
# `oaip records` raising FileNotFoundError anywhere but a checkout.
version = "0.3.0"
description = "Observed Action & Intent Protocol: a content-addressed causal graph of what humans, agents, and tools actually did — and on what observed basis you accepted the result."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "s0fractal" }]
keywords = ["provenance", "agents", "content-addressed", "warrant", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]
# stdlib only by design (argparse/hashlib/json/os/shutil/sqlite3/subprocess/
# sys/time/uuid/pathlib). Warrant is a normative dependency but is invoked as
# an external CLI (WARRANT_CLI / sibling checkout), not a Python import.
dependencies = []

[project.scripts]
oaip = "oaip:main"

[project.urls]
Homepage = "https://github.com/s0fractal/oaip"
Repository = "https://github.com/s0fractal/oaip"
Specification = "https://github.com/s0fractal/oaip/blob/main/SPEC.md"

# Flat impl/ layout preserved: impl/oaip.py installs as the top-level `oaip`
# module, and the `oaip` console script points at its argparse main().
#
# `oaip_vectors` is `examples/` under a package name. It exists because 0.2.0
# shipped `oaip conformance` and `oaip records` with a checkout-relative default
# path, so both traced back on a fresh install (see impl/oaip.py, "WHERE THE
# VECTOR CORPUS LIVES"). The vectors are the evidence those two verbs exist to
# replay; a wheel that omits them ships the verbs and not the thing they verify.
#
# The mapping — rather than a copy under impl/ — keeps ONE source of truth:
# `examples/vectors.json` is the path SPEC.md and llms.txt name, and it stays
# the file the build reads. Only the two .json corpora are packaged; the demo
# shell scripts in examples/ need a git checkout and a Warrant CLI, so shipping
# them would promise something the wheel cannot do.
[tool.setuptools]
package-dir = { "" = "impl", "oaip_vectors" = "examples" }
py-modules = ["oaip"]
packages = ["oaip_vectors"]

[tool.setuptools.package-data]
oaip_vectors = ["vectors.json", "record-vectors.json"]
